<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>城市与地铁</title>
  <meta name="author" content="VinsonFung">
  <meta name="copyright" content="Copyright © 2026 VinsonFung. Non-commercial use only. All rights reserved.">
  <meta name="description" content="以地铁规划为核心的单人网页模拟经营游戏：广州 1990、杭州 2000、香港 1970、台北 1990、东京 1950 五座真实城市与新手教程小城青湾。">
  <meta name="theme-color" content="#eaf1f7">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <script>
    // 首帧即应用主题，避免浅色闪烁
    (function () {
      var s = null, t = 'auto';
      try { s = JSON.parse(localStorage.getItem('cm1.settings') || 'null'); t = (s && s.theme) || localStorage.getItem('cm1.theme') || 'auto'; } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      if (s && s.uiScale) document.documentElement.style.setProperty('--uiz', String(s.uiScale));
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <!-- 社区改版标记：本仓库在原作基础上增加了深圳地图，其余内容与原作一致；合并回上游时可整段删除 -->
  <style>
    #modnote{bottom:8px;right:10px;font-size:11px;line-height:1;letter-spacing:.02em;opacity:.55;
      pointer-events:none;user-select:none;position:fixed;z-index:55;padding:4px 7px;border-radius:999px;
      color:var(--fg, #2b3a4a);background:var(--card, rgba(255,255,255,.72));
      border:1px solid var(--line, rgba(0,0,0,.12));backdrop-filter:blur(4px)}
    [data-theme="dark"] #modnote{color:#cbd6e2;background:rgba(22,30,42,.72);border-color:rgba(255,255,255,.14)}
  </style>
</head>
